[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.3.0"
description = "A coding agent built from scratch in Python: terminal + web UI, local or cloud models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",   # HTTP client: the only thing the agent core needs to talk to an LLM
]

[project.optional-dependencies]
tui = ["rich>=13", "prompt_toolkit>=3.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["harness*"]

[project.scripts]
harness = "harness.cli:main"   # `harness` command inside the venv

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: needs a running model server (run with: pytest -m live)"]
