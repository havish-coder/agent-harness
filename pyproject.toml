[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "An AI agent harness built from scratch in Python, as a hands-on course"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",   # HTTP client: the only thing we need to talk to an LLM
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["harness*"]
